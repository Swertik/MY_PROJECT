<div class="modal-backdrop" (click)="close.emit()"></div>

    <div class="modal-content" animate.enter="pop-in" animate.leave="pop-out">
      
      <div class="modal-header">
        <h3>История: {{ student().fio }}</h3>
        <button class="btn-close" (click)="close.emit()">✕</button>
      </div>

      <div class="history-list-container">
        
        <ul class="history-list">
          @for (task of reversedHistory(); track task.record_id) {
            <li class="history-item" [class.completed]="task.is_completed">
              
              <div class="task-info">
                <div class="task-name">{{ task.task_name }}</div>
                <div class="task-meta">
                  <span class="date">{{ task.date_str }}</span>
                  @if (task.is_completed) {
                    <span class="badge-success">Сдано</span>
                  } @else {
                    <span class="badge-pending">В процессе</span>
                  }
                </div>
              </div>

              @if (canDelete(task.record_id)) {
                <button 
                  class="btn-delete" 
                  title="Удалить (ошибочная выдача)"
                  (click)="onDelete(task.record_id)"
                >
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"></path>
                  </svg>
                </button>
              }

            </li>
          }
          @empty {
            <li class="empty-state">История заданий пуста</li>
          }
        </ul>

      </div>

    </div>
