<div class="modal-backdrop" (click)="close.emit()"></div>

    <div class="modal-content" animate.enter="pop-in" animate.leave="pop-out">
      
      <h3>Назначить задание</h3>
      
      <div class="info-row">
        <label>Студент:</label>
        <div class="readonly-value">{{ student().fio }}</div>
      </div>
      <div class="info-row">
        <label>Группа:</label>
        <div class="readonly-value">{{ student().groupName }}</div>
      </div>

      <div class="form-group">
        <label>Задание:</label>
        <select [ngModel]="selectedTaskId()" (ngModelChange)="selectedTaskId.set($event)">
          <option [ngValue]="null" disabled>Выберите задание...</option>
          @for (task of student_tasks(); track task.id) {
            <option [ngValue]="task.id">{{ task.name }}</option>
          }
        </select>
      </div>

      <div class="form-group checkbox-group">
        <label>
          <input 
            type="checkbox" 
            [ngModel]="isCompleted()" 
            (ngModelChange)="isCompleted.set($event)"
          >
          <span>Сразу отметить выполненным</span>
        </label>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" (click)="close.emit()">Отмена</button>
        <button 
          class="btn-save" 
          [disabled]="!selectedTaskId()" 
          (click)="saveTask()"
        >
          Назначить
        </button>
      </div>
    </div>
