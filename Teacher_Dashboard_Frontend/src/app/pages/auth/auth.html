<div class="auth-container">
  <div class="auth-card">
    <h2>{{ isLoginMode() ? 'Вход в систему' : 'Регистрация' }}</h2>
    
    <!-- Переключатель режимов -->
    <div class="mode-toggle">
      <button 
        type="button" 
        [ngClass]="{ active: isLoginMode() }"
        (click)="isLoginMode() || toggleMode()">
        Вход
      </button>
      <button 
        type="button" 
        [ngClass]="{ active: !isLoginMode() }"
        (click)="!isLoginMode() || toggleMode()">
        Регистрация
      </button>
    </div>

    <!-- Сообщение об ошибке -->
    <div class="error-message" *ngIf="errorMessage()">
      {{ errorMessage() }}
    </div>

    <!-- Форма входа -->
    <form *ngIf="isLoginMode()" (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label for="login-username">Имя пользователя:</label>
        <input 
          #loginUsername
          id="login-username"
          type="text" 
          [value]="loginForm().username"
          (input)="updateLoginField('username', loginUsername.value)"
          required
          [disabled]="isLoading()">
      </div>
      
      <div class="form-group">
        <label for="login-password">Пароль:</label>
        <input 
          #loginPassword
          id="login-password"
          type="password" 
          [value]="loginForm().password"
          (input)="updateLoginField('password', loginPassword.value)"
          required
          [disabled]="isLoading()">
      </div>
      
      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="isLoading()">
        {{ isLoading() ? 'Вход...' : 'Войти' }}
      </button>
    </form>

    <!-- Форма регистрации -->
    <form *ngIf="!isLoginMode()" (ngSubmit)="onRegister()" class="auth-form">
      <div class="form-group">
        <label for="register-username">Имя пользователя:</label>
        <input 
          #registerUsername
          id="register-username"
          type="text" 
          [value]="registerForm().username"
          (input)="updateRegisterField('username', registerUsername.value)"
          required
          [disabled]="isLoading()">
      </div>
      
      <div class="form-group">
        <label for="register-password">Пароль:</label>
        <input 
          #registerPassword
          id="register-password"
          type="password" 
          [value]="registerForm().password"
          (input)="updateRegisterField('password', registerPassword.value)"
          required
          [disabled]="isLoading()">
      </div>
      
      <div class="form-group">
        <label for="register-confirm">Подтвердите пароль:</label>
        <input 
          #registerConfirm
          id="register-confirm"
          type="password" 
          [value]="registerForm().confirmPassword"
          (input)="updateRegisterField('confirmPassword', registerConfirm.value)"
          required
          [disabled]="isLoading()">
      </div>
      
      <div class="form-group">
        <label for="register-role">Роль:</label>
        <select 
          #registerRole
          id="register-role"
          [value]="registerForm().role"
          (change)="updateRegisterField('role', registerRole.value)"
          [disabled]="isLoading()">
          <option value="Teacher">Преподаватель</option>
          <option value="Admin">Администратор</option>
        </select>
      </div>
      
      <button 
        type="submit" 
        class="submit-btn"
        [disabled]="isLoading()">
        {{ isLoading() ? 'Регистрация...' : 'Зарегистрироваться' }}
      </button>
    </form>
  </div>
</div>
